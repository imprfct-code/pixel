name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm check
      - run: pnpm test --run
      - run: pnpm dlx vercel@50.38.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@50.38.3 build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@50.38.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
